name = "blue-moon-web-do-not-deploy"
main = "src/worker/index.ts"
compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]

# Bundle font + logo files as raw bytes (ArrayBuffer) for PDF generation.
[[rules]]
type = "Data"
globs = ["**/*.ttf", "**/logo-email.png"]
fallthrough = true

[assets]
directory = "./dist"
not_found_handling = "404-page"
binding = "ASSETS"

[build]
command = "npm run build"

[vars]
CONTACT_TO_EMAIL = "bluemoon.mandre@gmail.com"

[env.production]
name = "blue-moon-web"
main = "src/worker/index.ts"
compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]

[env.production.assets]
directory = "./dist"
not_found_handling = "404-page"
binding = "ASSETS"

[env.production.build]
command = "npm run build"

[env.production.vars]
CONTACT_TO_EMAIL = "bluemoon.mandre@gmail.com"

# Reservations + availability + per-month pricing.
# Create with:  wrangler d1 create blue-moon-prod
# Then paste the returned database_id below.
[[env.production.d1_databases]]
binding       = "DB"
database_name = "blue-moon-prod"
database_id   = "fbc557df-f86e-445e-a710-002cc732d4f4"

# Stored guest invoice PDFs. Create once with:  wrangler r2 bucket create blue-moon-invoices
[[env.production.r2_buckets]]
binding     = "INVOICES"
bucket_name = "blue-moon-invoices"

[env.development]
name = "dev-blue-moon-web"
main = "src/worker/index.ts"
compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]

[env.development.assets]
directory = "./dist"
not_found_handling = "404-page"
binding = "ASSETS"

[env.development.build]
command = "npm run build"

[env.development.vars]
CONTACT_TO_EMAIL = "bluemoon.mandre@gmail.com"

# Create with:  wrangler d1 create blue-moon-dev
# Then paste the returned database_id below.
[[env.development.d1_databases]]
binding       = "DB"
database_name = "blue-moon-dev"
database_id   = "b46207a8-3c3b-41d4-b2b0-ec1f11fbbf14"

# Stored guest invoice PDFs (local emulation needs no bucket creation).
# For remote dev create once with:  wrangler r2 bucket create blue-moon-invoices-dev
[[env.development.r2_buckets]]
binding     = "INVOICES"
bucket_name = "blue-moon-invoices-dev"
